name: build-and-test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
          # Debug exercises Eigen's own assertions; unoptimised Eigen is far slower, so the
          # long end-to-end cases are skipped there.
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
            test_filter: "~[slow]"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang libeigen3-dev catch2

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DAETHER_ENABLE_WERROR=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test (full suite through CTest)
        if: matrix.build_type != 'Debug'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Debug subset, Eigen assertions enabled)
        if: matrix.build_type == 'Debug'
        timeout-minutes: 30
        run: ./build/bin/autocal_tests "${{ matrix.test_filter }}"

      # Reduced-size reproduction of the headline evaluation, run once (Release/GCC only), so
      # CI proves the documented commands work from a clean checkout.
      - name: Evaluation (reduced trial count)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          python3 -m pip install --quiet matplotlib
          python3 python/scripts/eval.py --trials 8 --output results/ci

      - name: Upload artefacts
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: autocal-lite-results
          path: |
            results/ci/
          if-no-files-found: error
          retention-days: 14
